name: Windows-Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyMuPDF Pillow

      - name: Version und Release-Stand prüfen
        id: version
        shell: pwsh
        run: |
          $version = python -c "from main import APP_VERSION; print(APP_VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungültige APP_VERSION: $version" }
          $line = Select-String -Path installer.iss -Pattern '^#define MyAppVersion "([^"]+)"$'
          if (-not $line -or $line.Matches[0].Groups[1].Value -ne $version) {
            throw "APP_VERSION und installer.iss stimmen nicht überein."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag muss v$version heißen." }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Release-Tag muss auf main liegen." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        shell: pwsh
        run: |
          python -m py_compile main.py update_service.py color_mixer.py
          python -m unittest discover -s tests -v

      - name: Windows-EXE bauen
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --noconsole --clean --name MJETXHelper `
            --collect-all fitz --collect-all PIL `
            --hidden-import fitz --hidden-import PIL `
            --hidden-import PIL.Image --hidden-import PIL.ImageChops `
            --hidden-import PIL.ImageFilter --hidden-import PIL.PngImagePlugin `
            --add-data "data\reference_colors.json;data" `
            --add-data "assets\mprint_logo.svg;assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE-Build fehlgeschlagen." }

      - name: Installer bauen
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = @(
              (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup 6 ist auf dem Windows-Runner nicht verfügbar." }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer-Build fehlgeschlagen." }
          if (-not (Test-Path "installer_dist\MJETXHelper_Setup_v${{ steps.version.outputs.version }}.exe")) {
            throw "Installer-Datei wurde nicht erzeugt."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MJETXHelper-Windows-Installer
          path: installer_dist/MJETXHelper_Setup_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MJETXHelper-Windows-Installer
          path: installer_dist

      - name: Release-Entwurf mit Installer anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NOTES_FILE="release_notes/${RELEASE_TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release-Notizen fehlen: $NOTES_FILE"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "installer_dist/MJETXHelper_Setup_v${RELEASE_VERSION}.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "MJET-X Helper ${RELEASE_VERSION}" \
            --notes-file "$NOTES_FILE"
